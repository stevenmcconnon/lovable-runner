name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      TEST_API_BASE: ${{ secrets.TEST_API_BASE }}
      TEST_CUSTOMER_TOKEN: ${{ secrets.TEST_CUSTOMER_TOKEN }}
      TEST_ADMIN_TOKEN: ${{ secrets.TEST_ADMIN_TOKEN }}
      TEST_MACHINE_TOKEN: ${{ secrets.TEST_MACHINE_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run migrations (if DATABASE_URL provided)
        if: env.DATABASE_URL != ''
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run API tests
        if: env.TEST_API_BASE != '' && env.TEST_CUSTOMER_TOKEN != '' && env.TEST_ADMIN_TOKEN != ''
        run: npm run test:api
        env:
          TEST_API_BASE: ${{ env.TEST_API_BASE }}
          TEST_CUSTOMER_TOKEN: ${{ env.TEST_CUSTOMER_TOKEN }}
          TEST_ADMIN_TOKEN: ${{ env.TEST_ADMIN_TOKEN }}
          TEST_MACHINE_TOKEN: ${{ env.TEST_MACHINE_TOKEN }}
