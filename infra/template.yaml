  DomainJobFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn:
      - DomainWorkerFunctionLogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DomainWorkerFunction}
      FilterPattern: '"domain.job.failed"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/DomainJobs
          MetricName: DomainJobFailures

  DomainJobFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-job-failures
      AlarmDescription: Domain job runner is failing repeatedly
      Namespace: !Sub ${AWS::StackName}/DomainJobs
      MetricName: DomainJobFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

  DomainLifecycleFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn:
      - DomainWorkerFunctionLogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DomainWorkerFunction}
      FilterPattern: '"domain.lifecycle.failed"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/DomainJobs
          MetricName: DomainLifecycleFailures

  DomainLifecycleFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-lifecycle-failures
      AlarmDescription: Domains are entering FAILED state too frequently
      Namespace: !Sub ${AWS::StackName}/DomainJobs
      MetricName: DomainLifecycleFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

  DomainThrottleMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn:
      - DomainWorkerFunctionLogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DomainWorkerFunction}
      FilterPattern: '"ThrottlingException"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/DomainJobs
          MetricName: DomainAwsThrottles

  DomainThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-aws-throttles
      AlarmDescription: ACM or CloudFront is throttling domain automation calls
      Namespace: !Sub ${AWS::StackName}/DomainJobs
      MetricName: DomainAwsThrottles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-errors
      AlarmDescription: API Lambda is returning errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RunnerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RunnerWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-runner-worker-errors
      AlarmDescription: Runner worker is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RunnerWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RunnerJobsWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-site-jobs-worker-errors
      AlarmDescription: Site jobs worker is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RunnerJobsWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  AnalyticsWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-analytics-worker-errors
      AlarmDescription: Analytics ingestion worker is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AnalyticsEventsWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  DomainWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-worker-errors
      AlarmDescription: Domain worker is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DomainWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  NotificationWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-notification-worker-errors
      AlarmDescription: Notification worker is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationWorkerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-rds-cpu-high
      AlarmDescription: RDS CPU over 80% (sustained)
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RunnerDatabase
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RdsConnectionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-rds-connections-high
      AlarmDescription: RDS connections approaching limit
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RunnerDatabase
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RunnerQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-runner-queue-backlog
      AlarmDescription: Runner queue depth is growing faster than the worker can drain it
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RunnerJobQueue.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RunnerQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-runner-queue-age
      AlarmDescription: Runner queue messages are getting stale
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RunnerJobQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RunnerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-runner-dlq
      AlarmDescription: Runner DLQ has messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt RunnerJobDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  DomainDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-dlq
      AlarmDescription: Domain job DLQ has messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DomainJobDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  AnalyticsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-analytics-dlq
      AlarmDescription: Analytics DLQ has messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyticsEventDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  RunnerFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-runner-errors
      AlarmDescription: Runner API Lambda errors are spiking
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RunnerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  AnalyticsQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-analytics-queue-backlog
      AlarmDescription: Analytics ingestion queue depth is building up
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyticsEventQueue.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  AnalyticsQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-analytics-queue-age
      AlarmDescription: Old analytics messages are waiting too long
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AnalyticsEventQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 120
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  JobEventFailureMetricFilterApi:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /aws/lambda/${RunnerFunction}
      FilterPattern: '"[job-events] record.failed"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/JobEvents
          MetricName: RecordFailures
  JobEventFailureMetricFilterWorker:
    Type: AWS::Logs::MetricFilter
    DependsOn:
      - RunnerWorkerFunctionLogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${RunnerWorkerFunction}
      FilterPattern: '"[job-events] record.failed"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/JobEvents
          MetricName: RecordFailures
  JobEventFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-job-event-failures
      AlarmDescription: Job event writes are failing
      Namespace: !Sub ${AWS::StackName}/JobEvents
      MetricName: RecordFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-ops
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Runner Queue Depth",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${RunnerJobQueue.QueueName}" ]
                ],
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Runner Queue Age",
                "metrics": [
                  [ "AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${RunnerJobQueue.QueueName}" ]
                ],
                "region": "${AWS::Region}",
                "stat": "Maximum",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Analytics Queue Depth",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${AnalyticsEventQueue.QueueName}" ]
                ],
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 60
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Job Event Failures",
                "metrics": [
                  [ "${AWS::StackName}/JobEvents", "RecordFailures" ]
                ],
                "region": "${AWS::Region}",
              "stat": "Sum",
              "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "DLQ Depth",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${RunnerJobDeadLetterQueue.QueueName}" ],
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${DomainJobDeadLetterQueue.QueueName}" ],
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${AnalyticsEventDeadLetterQueue.QueueName}" ]
                ],
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Errors",
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${RunnerFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${RunnerWorkerFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${RunnerJobsWorkerFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${DomainWorkerFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${AnalyticsEventsWorkerFunction}", { "stat": "Sum" } ]
                ],
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300
              }
            }
          ]
        }

  ContactEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ContactFromEmail

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-client
      GenerateSecret: false
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://example.com/callback

  UserPoolMachineClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-machine
      GenerateSecret: true
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - lovable-backend/internal
      SupportedIdentityProviders:
        - COGNITO

  UserGroupSuperAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super-admin
      UserPoolId: !Ref UserPool

  UserGroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  UserGroupUser:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      UserPoolId: !Ref UserPool


Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${RunnerApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiCustomDomain:
    Condition: HasCustomDomain
    Description: Custom API domain (if configured)
    Value: !Ref ApiCustomDomainName
  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id
    Value: !Ref UserPoolClient
  UserPoolMachineClientId:
    Description: Cognito machine-to-machine client id
    Value: !Ref UserPoolMachineClient
  DatabaseEndpoint:
    Description: PostgreSQL endpoint address
    Value: !GetAtt RunnerDatabase.Endpoint.Address
  DatabaseName:
    Description: PostgreSQL database name
    Value: !Ref DBName
  DatabaseCredentialsSecretArn:
    Description: Secret ARN containing database credentials
    Value: !Ref DatabaseCredentialsSecret
  StaticEgressIpAddress:
    Description: Elastic IP address used for Lambda outbound traffic
    Value: !Ref RunnerStaticEgressEip
  DatabaseProxyEndpoint:
    Condition: UseDbProxy
    Description: RDS Proxy endpoint used by the Lambda functions
    Value: !GetAtt RunnerDbProxy.Endpoint
  RunnerQueueUrlOutput:
    Description: SQS queue URL buffering runner jobs
    Value: !GetAtt RunnerJobQueue.QueueUrl
  AnalyticsQueueUrlOutput:
    Description: SQS queue URL ingesting analytics events
    Value: !GetAtt AnalyticsEventQueue.QueueUrl
