AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI SiteMaker backend API

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 900
    MemorySize: 2048
    Architectures:
      - x86_64

Parameters:
  DeployBucket:
    Type: String
    Description: S3 bucket that stores generated sites
  ApiCustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (e.g., api.ai-sitemaker.com). Leave blank to skip.
  ApiCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for the custom domain (us-east-1). Required when ApiCustomDomainName is set.
  DBName:
    Type: String
    Default: aisitemaker
    Description: Name of the application database
  DBUsername:
    Type: String
    Default: lovable_runner
    MinLength: 1
    Description: Master username for the RDS instance
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master user password for the RDS instance
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Instance class for the RDS instance (adjust for load)
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Allocated storage in GiB for the RDS instance
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: Automated snapshot retention in days for the RDS instance
  DbVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-06707eddabf2dae24
    Description: VPC where the RDS instance will live
  DbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-04c228a7b5b68ff53,subnet-0b80e76ccd6b56ac6
    Description: Two or more subnets (different AZs) for the RDS subnet group
  DbAllowedCidr:
    Type: String
    Default: ''
    Description: Optional CIDR block allowed to reach PostgreSQL directly (leave blank to restrict access to the Lambda security group only)
  AnalyticsDatabaseUrl:
    Type: String
    Default: ''
    Description: Optional Postgres connection string for analytics + telemetry writes
  NatGatewaySubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-04c228a7b5b68ff53
    Description: Public subnet (with an internet gateway route) where the Lambda NAT gateway will live
  LambdaPrivateSubnetACidr:
    Type: String
    Default: 172.31.96.0/20
    Description: CIDR block for the first private subnet used by the Lambda function (must be inside the VPC and not overlap)
  LambdaPrivateSubnetBCidr:
    Type: String
    Default: 172.31.112.0/20
    Description: CIDR block for the second private subnet used by the Lambda function (must be inside the VPC and not overlap)
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret API key
  StripeSecretKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Stripe secret key (SecretString)
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret
  StripeWebhookSecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Stripe webhook secret (SecretString)
  TemplateUploadBucket:
    Type: String
    Description: S3 bucket used to store uploaded templates
  SiteSigningSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: HMAC secret used to verify signed site-to-backend requests
  TemplateLibraryBaseUrl:
    Type: String
    Default: ''
    Description: Optional base URL for the template manifest endpoints (e.g., https://api.ai-sitemaker.com)
  DefaultTrialEditLimit:
    Type: Number
    Default: 1
    Description: Number of trial edits allowed before subscription is required
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key for Gemini (used by the runner Lambda)
  GeminiApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN holding the Gemini API key (string value)
  GeminiModel:
    Type: String
    Default: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.0-pro:generateContent'
    Description: Optional override for the Gemini model endpoint (use latest Gemini 3 endpoint)
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key for the OpenAI Responses API (used when Gemini is disabled)
  OpenAIApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the OpenAI API key
  OpenAIModel:
    Type: String
    Default: 'gpt-5.1'
    Description: OpenAI model identifier (e.g., gpt-5.1, gpt-4.1)
  GoogleImageModel:
    Type: String
    Default: 'imagen-3.0-generate-1'
    Description: Image model used for asset generation (e.g., imagen-3.0-generate-1)
  IntegrationKmsKeyArn:
    Type: String
    MinLength: 1
    Description: KMS key ARN used to encrypt integration tokens (required for production)
  RunnerApiBase:
    Type: String
    Default: https://api.ai-sitemaker.com
    Description: Base URL for posting internal job updates (machine token required)
  CognitoM2MClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Secret for the machine-to-machine Cognito app client (for internal job callbacks)
  CognitoDomain:
    Type: String
    Default: ai-sitemaker-auth.auth.us-east-1.amazoncognito.com
    Description: Cognito hosted UI domain (e.g., yourdomain.auth.us-east-1.amazoncognito.com)
  FrontendOrigin:
    Type: String
    Default: https://ai-sitemaker.com
    Description: Allowed browser origin for API responses
  AuthCallbackUrl:
    Type: String
    Default: https://ai-sitemaker.com/auth/callback
    Description: Redirect URI used for OAuth exchanges
  PreviewDomainName:
    Type: String
    Default: ''
    Description: Optional preview domain (e.g., preview.ai-sitemaker.com) served via CloudFront
  LiveDomainName:
    Type: String
    Default: ''
    Description: Primary live domain used when publishing customer sites (e.g., sites.ai-sitemaker.com)
  CustomDomainOriginHost:
    Type: String
    Default: ''
    Description: Optional internal hostname that CloudFront should use as the origin for customer domains (defaults to LiveDomainName or PreviewDomainName)
  CustomDomainCanonicalDefault:
    Type: String
    AllowedValues:
      - apex
      - www
    Default: apex
    Description: Default canonical option when customers connect a domain (apex or www)
  CustomDomainDistributionId:
    Type: String
    Default: ''
    Description: Shared CloudFront distribution id that serves all customer domains (leave blank to disable automatic alias attachment)
  CustomDomainCertRegion:
    Type: String
    Default: us-east-1
    Description: Region where ACM should request certificates for custom domains
  CustomDomainPriceClass:
    Type: String
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Default: PriceClass_100
    Description: Price class used when provisioning per-domain distributions
  DomainBasePriceCents:
    Type: Number
    Default: 1200
    Description: Default fallback Namecheap base price in cents when pricing lookup fails
  DomainPriceMarkupCents:
    Type: Number
    Default: 300
    Description: Markup (in cents) added on top of Namecheap’s price when customers buy domains
  DomainJobBatchLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50
    Description: Maximum number of domain jobs processed per invocation
  DomainJobMaxRuntimeMs:
    Type: Number
    Default: 60000
    MinValue: 1000
    MaxValue: 300000
    Description: Maximum runtime (milliseconds) allowed for a single domain job batch
  RunnerReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 500
    Description: Reserved concurrency limit for the runner Lambda to contain async worker storms (set to 0 to disable)
  RunnerJobWorkerReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 500
    Description: Reserved concurrency for the site job SQS worker (set 0 to disable)
  AnalyticsWorkerReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 500
    Description: Reserved concurrency for the analytics ingest worker (set 0 to disable)
  DomainWorkerReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 500
    Description: Reserved concurrency for the domain job worker (set 0 to disable)
  DomainMaxPerAccount:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 50
    Description: Maximum number of custom domains allowed per account
  DomainOrderDailyLimit:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 50
    Description: Maximum number of pending domain orders per account per day
  DomainRefreshDailyLimit:
    Type: Number
    Default: 25
    MinValue: 0
    MaxValue: 200
    Description: Maximum number of manual HTTPS refresh requests per account per day
  AnalyticsVisitorRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 365
    Description: Days to retain raw analytics visitor/referrer rows before cleanup
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: SNS topic ARN to notify on alarms (leave blank to skip notifications)
  RateLimitRetentionMinutes:
    Type: Number
    Default: 1440
    MinValue: 5
    Description: Minutes to retain entries in rate_limit_counters before cleanup
  AuditLogRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days to retain site audit log records before cleanup
  LogRetentionInDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: CloudWatch log retention in days for all Lambdas
  SiteBuilderApiEnabled:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Toggle to enable or disable the /sites builder endpoints.
  SiteDocsToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional shared secret required to view /openapi.json and /docs.
  SiteDocsTokenSecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the site docs token (SecretString)
  ThumbnailServiceBase:
    Type: String
    Default: 'https://image.thum.io/get/png/width/1200/noanimate'
    Description: Base URL for screenshot service (appends ?url=...; leave blank to disable thumbnails).
  UnsplashAccessKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Access key for the Unsplash API (used for stock imagery).
  UnsplashAccessKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Unsplash access key (SecretString)
  NamecheapApiUser:
    Type: String
    Default: ''
    Description: Namecheap API user (set to enable managed domain purchases)
  NamecheapApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Namecheap API key paired with the user (used when no secret ARN is provided)
  NamecheapApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the Namecheap API key (SecretString)
  NamecheapUsername:
    Type: String
    Default: ''
    Description: Optional override for the Namecheap account username (defaults to NamecheapApiUser)
  NamecheapApiBase:
    Type: String
    Default: https://api.namecheap.com/xml.response
    Description: Base URL for the Namecheap API (use the sandbox URL when testing)
  ContactFromEmail:
    Type: String
    Default: 'formsubmissions@ai-sitemaker.com'
    Description: Verified SES email used as the From address for contact form submissions.
  GoogleCalendarClientId:
    Type: String
    Default: ''
    Description: Google OAuth client ID for calendar syncing.
  GoogleCalendarClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google OAuth client secret for calendar syncing.
  GoogleCalendarRedirectUri:
    Type: String
    Default: 'https://api.ai-sitemaker.com/oauth/calendar/google/callback'
    Description: Redirect URI registered for Google Calendar OAuth.
  OutlookCalendarClientId:
    Type: String
    Default: ''
    Description: Microsoft/Outlook app client ID for calendar syncing.
  OutlookCalendarClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Microsoft/Outlook app client secret for calendar syncing.
  OutlookCalendarRedirectUri:
    Type: String
    Default: 'https://api.ai-sitemaker.com/oauth/calendar/outlook/callback'
    Description: Redirect URI registered for Outlook calendar OAuth.
  UseRdsProxy:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable an Amazon RDS Proxy endpoint for the Lambda functions to connect through (recommended)

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref ApiCustomDomainName, '']]
    - !Not [!Equals [!Ref ApiCertificateArn, '']]
  HasGeminiSecret: !Not [!Equals [!Ref GeminiApiKeySecretArn, '']]
  HasOpenAISecret: !Not [!Equals [!Ref OpenAIApiKeySecretArn, '']]
  HasPreviewDomain: !Not [!Equals [!Ref PreviewDomainName, '']]
  HasIntegrationKmsKey: !Not [!Equals [!Ref IntegrationKmsKeyArn, '']]
  HasNamecheapApiKeySecret: !Not [!Equals [!Ref NamecheapApiKeySecretArn, '']]
  HasStripeSecretKeySecret: !Not [!Equals [!Ref StripeSecretKeySecretArn, '']]
  HasStripeWebhookSecret: !Not [!Equals [!Ref StripeWebhookSecretArn, '']]
  HasSiteDocsTokenSecret: !Not [!Equals [!Ref SiteDocsTokenSecretArn, '']]
  HasUnsplashAccessKeySecret: !Not [!Equals [!Ref UnsplashAccessKeySecretArn, '']]
  HasReservedConcurrency: !Not [!Equals [!Ref RunnerReservedConcurrency, 0]]
  HasRunnerJobReservedConcurrency: !Not [!Equals [!Ref RunnerJobWorkerReservedConcurrency, 0]]
  HasAnalyticsWorkerReservedConcurrency: !Not [!Equals [!Ref AnalyticsWorkerReservedConcurrency, 0]]
  HasDomainWorkerReservedConcurrency: !Not [!Equals [!Ref DomainWorkerReservedConcurrency, 0]]
  HasDbAllowedCidr: !Not [!Equals [!Ref DbAllowedCidr, '']]
  UseDbProxy: !Equals [!Ref UseRdsProxy, 'true']
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Resources:
  RunnerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - Stripe-Signature
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowCredentials: true
  RunnerApiCustomDomain:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::DomainName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  RunnerApiDomainMapping:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref RunnerApi
      DomainName: !Ref RunnerApiCustomDomain
      Stage: prod

  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-db-credentials
      Description: Credentials for the AI SiteMaker PostgreSQL database
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "database": "${DBName}"
        }

  RunnerDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      PubliclyAccessible: false
      AllocatedStorage: !Ref DBAllocatedStorage
      DBInstanceClass: !Ref DBInstanceClass
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      BackupRetentionPeriod: !Ref BackupRetentionDays
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      MultiAZ: false
      StorageEncrypted: true
      VPCSecurityGroups:
        - !Ref RunnerDbSecurityGroup
      DBSubnetGroupName: !Ref RunnerDbSubnetGroup

  RunnerDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access to Lovable Runner DB
      VpcId: !Ref DbVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RunnerFunctionSecurityGroup
        - !If
          - UseDbProxy
          - 
            IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId: !Ref RunnerDbProxySecurityGroup
          - !Ref AWS::NoValue
        - !If
          - HasDbAllowedCidr
          - 
            IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: !Ref DbAllowedCidr
          - !Ref AWS::NoValue

  RunnerDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Lovable Runner database
      SubnetIds: !Ref DbSubnetIds
  RunnerDbProxyRole:
    Condition: UseDbProxy
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - rds.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: allow-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseCredentialsSecret
  RunnerDbProxy:
    Condition: UseDbProxy
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub ${AWS::StackName}-proxy
      EngineFamily: POSTGRESQL
      IdleClientTimeout: 1800
      RequireTLS: true
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DatabaseCredentialsSecret
          IAMAuth: DISABLED
      RoleArn: !GetAtt RunnerDbProxyRole.Arn
      VpcSecurityGroupIds:
        - !Ref RunnerDbProxySecurityGroup
      VpcSubnetIds:
        - !Ref RunnerLambdaPrivateSubnetA
        - !Ref RunnerLambdaPrivateSubnetB
  RunnerDbProxyTargetGroup:
    Condition: UseDbProxy
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref RunnerDbProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref RunnerDatabase
  RunnerLambdaPrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DbVpcId
      CidrBlock: !Ref LambdaPrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-private-a
  RunnerLambdaPrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DbVpcId
      CidrBlock: !Ref LambdaPrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-private-b
  RunnerStaticEgressEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-egress
  RunnerStaticNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt RunnerStaticEgressEip.AllocationId
      ConnectivityType: public
      SubnetId: !Ref NatGatewaySubnetId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-nat
  RunnerLambdaPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DbVpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-private
  RunnerLambdaPrivateRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - RunnerStaticNatGateway
    Properties:
      RouteTableId: !Ref RunnerLambdaPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RunnerStaticNatGateway
  RunnerLambdaPrivateSubnetAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RunnerLambdaPrivateRouteTable
      SubnetId: !Ref RunnerLambdaPrivateSubnetA
  RunnerLambdaPrivateSubnetBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RunnerLambdaPrivateRouteTable
      SubnetId: !Ref RunnerLambdaPrivateSubnetB
  RunnerS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref DbVpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RunnerLambdaPrivateRouteTable
  RunnerSqsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref DbVpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sqs
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref RunnerLambdaPrivateSubnetA
        - !Ref RunnerLambdaPrivateSubnetB
      SecurityGroupIds:
        - !Ref RunnerFunctionSecurityGroup
  RunnerStsInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref DbVpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref RunnerLambdaPrivateSubnetA
        - !Ref RunnerLambdaPrivateSubnetB
      SecurityGroupIds:
        - !Ref RunnerFunctionSecurityGroup
  RunnerFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the runner Lambda ENIs
      VpcId: !Ref DbVpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-runner-lambda
  RunnerDbProxySecurityGroup:
    Condition: UseDbProxy
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Lambda ENIs to reach the RDS Proxy
      VpcId: !Ref DbVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RunnerFunctionSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-runner-db-proxy
  LeadInboxTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: leadId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: leadId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  SiteAnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: statDate
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: statDate
          KeyType: RANGE
  SiteReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: reviewId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: reviewId
          KeyType: RANGE
  SiteAppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: appointmentId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: appointmentId
          KeyType: RANGE
  AppointmentSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
  NotificationPreferencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: recipient
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: recipient
          KeyType: RANGE
  RunnerJobDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-runner-jobs-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-runner-jobs-dlq
  RunnerJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-runner-jobs
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600 # 14 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt RunnerJobDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-runner-jobs
  AnalyticsEventDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-analytics-events-dlq
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-analytics-events-dlq
  AnalyticsEventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-analytics-events
      VisibilityTimeout: 900
      MessageRetentionPeriod: 604800 # 7 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalyticsEventDeadLetterQueue.Arn
        maxReceiveCount: 10
      Tags:
        - Key: Name
