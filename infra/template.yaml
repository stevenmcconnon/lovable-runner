AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI SiteMaker backend API

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 900
    MemorySize: 2048
    Architectures:
      - x86_64

Parameters:
  DeployBucket:
    Type: String
    Description: S3 bucket that stores generated sites
  ApiCustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (e.g., api.ai-sitemaker.com). Leave blank to skip.
  ApiCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for the custom domain (us-east-1). Required when ApiCustomDomainName is set.
  DBName:
    Type: String
    Default: aisitemaker
    Description: Name of the application database
  DBUsername:
    Type: String
    Default: lovable_runner
    MinLength: 1
    Description: Master username for the RDS instance
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master user password for the RDS instance
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Instance class for the RDS instance
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Allocated storage in GiB for the RDS instance
  DbVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-06707eddabf2dae24
    Description: VPC where the RDS instance will live
  DbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-04c228a7b5b68ff53,subnet-0b80e76ccd6b56ac6
    Description: Two or more subnets (different AZs) for the RDS subnet group
  DbAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to access the PostgreSQL port (adjust to your frontend's IP range)
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret API key
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret
  RunnerLambdaName:
    Type: String
    Description: Name of the Lovable runner Lambda for job orchestration
  TemplateUploadBucket:
    Type: String
    Description: S3 bucket used to store uploaded templates
  DefaultTrialEditLimit:
    Type: Number
    Default: 1
    Description: Number of trial edits allowed before subscription is required

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref ApiCustomDomainName, '']]
    - !Not [!Equals [!Ref ApiCertificateArn, '']]

Resources:
  RunnerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
  RunnerApiCustomDomain:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::DomainName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  RunnerApiDomainMapping:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref RunnerApi
      DomainName: !Ref RunnerApiCustomDomain
      Stage: prod

  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-db-credentials
      Description: Credentials for the AI SiteMaker PostgreSQL database
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "database": "${DBName}"
        }

  RunnerDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      PubliclyAccessible: true
      AllocatedStorage: !Ref DBAllocatedStorage
      DBInstanceClass: !Ref DBInstanceClass
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      BackupRetentionPeriod: 1
      DeletionProtection: false
      MultiAZ: false
      StorageEncrypted: true
      VPCSecurityGroups:
        - !Ref RunnerDbSecurityGroup
      DBSubnetGroupName: !Ref RunnerDbSubnetGroup

  RunnerDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access to Lovable Runner DB
      VpcId: !Ref DbVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref DbAllowedCidr

  RunnerDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Lovable Runner database
      SubnetIds: !Ref DbSubnetIds
  RunnerFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - RunnerDatabase
    Properties:
      CodeUri: ../
      Handler: dist/lambda.handler
      Description: Backend API for AI SiteMaker
      Environment:
        Variables:
          NODE_ENV: production
          DB_HOST: !GetAtt RunnerDatabase.Endpoint.Address
          DB_PORT: !GetAtt RunnerDatabase.Endpoint.Port
          DB_NAME: !Ref DBName
          DB_USERNAME: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_USER_POOL_REGION: !Ref AWS::Region
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
          COGNITO_M2M_CLIENT_ID: !Ref UserPoolMachineClient
          RUNNER_FUNCTION_NAME: !Ref RunnerLambdaName
          TEMPLATE_UPLOAD_BUCKET: !Ref TemplateUploadBucket
          DEFAULT_TRIAL_EDIT_LIMIT: !Ref DefaultTrialEditLimit
      Events:
        RootProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RunnerApi
            Path: /
            Method: ANY
        CatchAllProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RunnerApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref DeployBucket
        - S3CrudPolicy:
            BucketName: !Ref TemplateUploadBucket
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${RunnerLambdaName}

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-client
      GenerateSecret: false
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://example.com/callback

  UserPoolMachineClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-machine
      GenerateSecret: true
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - lovable-backend/internal
      SupportedIdentityProviders:
        - COGNITO

  UserGroupSuperAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super-admin
      UserPoolId: !Ref UserPool

  UserGroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  UserGroupUser:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      UserPoolId: !Ref UserPool

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${RunnerApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiCustomDomain:
    Condition: HasCustomDomain
    Description: Custom API domain (if configured)
    Value: !Ref ApiCustomDomainName
  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id
    Value: !Ref UserPoolClient
  UserPoolMachineClientId:
    Description: Cognito machine-to-machine client id
    Value: !Ref UserPoolMachineClient
  DatabaseEndpoint:
    Description: PostgreSQL endpoint address
    Value: !GetAtt RunnerDatabase.Endpoint.Address
  DatabaseName:
    Description: PostgreSQL database name
    Value: !Ref DBName
  DatabaseCredentialsSecretArn:
    Description: Secret ARN containing database credentials
    Value: !Ref DatabaseCredentialsSecret
