AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI SiteMaker backend API

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 900
    MemorySize: 2048
    Architectures:
      - x86_64

Parameters:
  DeployBucket:
    Type: String
    Description: S3 bucket that stores generated sites
  ApiCustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (e.g., api.ai-sitemaker.com). Leave blank to skip.
  ApiCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for the custom domain (us-east-1). Required when ApiCustomDomainName is set.
  DBName:
    Type: String
    Default: aisitemaker
    Description: Name of the application database
  DBUsername:
    Type: String
    Default: lovable_runner
    MinLength: 1
    Description: Master username for the RDS instance
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master user password for the RDS instance
  DBInstanceClass:
    Type: String
    Default: db.t4g.small
    Description: Instance class for the RDS instance (adjust for load)
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Allocated storage in GiB for the RDS instance
  DbVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-06707eddabf2dae24
    Description: VPC where the RDS instance will live
  DbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-04c228a7b5b68ff53,subnet-0b80e76ccd6b56ac6
    Description: Two or more subnets (different AZs) for the RDS subnet group
  DbAllowedCidr:
    Type: String
    Default: ''
    Description: Optional CIDR block allowed to reach PostgreSQL directly (leave blank to restrict access to the Lambda security group only)
  NatGatewaySubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-04c228a7b5b68ff53
    Description: Public subnet (with an internet gateway route) where the Lambda NAT gateway will live
  LambdaPrivateSubnetACidr:
    Type: String
    Default: 172.31.96.0/20
    Description: CIDR block for the first private subnet used by the Lambda function (must be inside the VPC and not overlap)
  LambdaPrivateSubnetBCidr:
    Type: String
    Default: 172.31.112.0/20
    Description: CIDR block for the second private subnet used by the Lambda function (must be inside the VPC and not overlap)
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret API key
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret
  TemplateUploadBucket:
    Type: String
    Description: S3 bucket used to store uploaded templates
  DefaultTrialEditLimit:
    Type: Number
    Default: 1
    Description: Number of trial edits allowed before subscription is required
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key for Gemini (used by the runner Lambda)
  GeminiApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN holding the Gemini API key (string value)
  GeminiModel:
    Type: String
    Default: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.0-pro:generateContent'
    Description: Optional override for the Gemini model endpoint (use latest Gemini 3 endpoint)
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key for the OpenAI Responses API (used when Gemini is disabled)
  OpenAIApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the OpenAI API key
  OpenAIModel:
    Type: String
    Default: 'gpt-5.1'
    Description: OpenAI model identifier (e.g., gpt-5.1, gpt-4.1)
  GoogleImageModel:
    Type: String
    Default: 'imagen-3.0-generate-1'
    Description: Image model used for asset generation (e.g., imagen-3.0-generate-1)
  IntegrationKmsKeyArn:
    Type: String
    Default: ''
    Description: Optional KMS key ARN used to encrypt integration tokens (set for production)
  RunnerApiBase:
    Type: String
    Default: https://api.ai-sitemaker.com
    Description: Base URL for posting internal job updates (machine token required)
  CognitoM2MClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Secret for the machine-to-machine Cognito app client (for internal job callbacks)
  CognitoDomain:
    Type: String
    Default: ai-sitemaker-auth.auth.us-east-1.amazoncognito.com
    Description: Cognito hosted UI domain (e.g., yourdomain.auth.us-east-1.amazoncognito.com)
  FrontendOrigin:
    Type: String
    Default: https://ai-sitemaker.com
    Description: Allowed browser origin for API responses
  AuthCallbackUrl:
    Type: String
    Default: https://ai-sitemaker.com/auth/callback
    Description: Redirect URI used for OAuth exchanges
  PreviewDomainName:
    Type: String
    Default: ''
    Description: Optional preview domain (e.g., preview.ai-sitemaker.com) served via CloudFront
  LiveDomainName:
    Type: String
    Default: ''
    Description: Primary live domain used when publishing customer sites (e.g., sites.ai-sitemaker.com)
  CustomDomainOriginHost:
    Type: String
    Default: ''
    Description: Optional internal hostname that CloudFront should use as the origin for customer domains (defaults to LiveDomainName or PreviewDomainName)
  CustomDomainCanonicalDefault:
    Type: String
    AllowedValues:
      - apex
      - www
    Default: apex
    Description: Default canonical option when customers connect a domain (apex or www)
  CustomDomainDistributionId:
    Type: String
    Default: ''
    Description: Shared CloudFront distribution id that serves all customer domains (leave blank to disable automatic alias attachment)
  CustomDomainCertRegion:
    Type: String
    Default: us-east-1
    Description: Region where ACM should request certificates for custom domains
  CustomDomainPriceClass:
    Type: String
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Default: PriceClass_100
    Description: Price class used when provisioning per-domain distributions
  DomainBasePriceCents:
    Type: Number
    Default: 1200
    Description: Default fallback Namecheap base price in cents when pricing lookup fails
  DomainPriceMarkupCents:
    Type: Number
    Default: 300
    Description: Markup (in cents) added on top of Namecheap’s price when customers buy domains
  DomainJobBatchLimit:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50
    Description: Maximum number of domain jobs processed per invocation
  DomainJobMaxRuntimeMs:
    Type: Number
    Default: 60000
    MinValue: 1000
    MaxValue: 300000
    Description: Maximum runtime (milliseconds) allowed for a single domain job batch
  RunnerReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 500
    Description: Reserved concurrency limit for the runner Lambda to contain async worker storms (set to 0 to disable)
  DomainMaxPerAccount:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 50
    Description: Maximum number of custom domains allowed per account
  DomainOrderDailyLimit:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 50
    Description: Maximum number of pending domain orders per account per day
  DomainRefreshDailyLimit:
    Type: Number
    Default: 25
    MinValue: 0
    MaxValue: 200
    Description: Maximum number of manual HTTPS refresh requests per account per day
  SiteBuilderApiEnabled:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Toggle to enable or disable the /sites builder endpoints.
  SiteDocsToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional shared secret required to view /openapi.json and /docs.
  ThumbnailServiceBase:
    Type: String
    Default: 'https://image.thum.io/get/png/width/1200/noanimate'
    Description: Base URL for screenshot service (appends ?url=...; leave blank to disable thumbnails).
  UnsplashAccessKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Access key for the Unsplash API (used for stock imagery).
  NamecheapApiUser:
    Type: String
    Default: ''
    Description: Namecheap API user (set to enable managed domain purchases)
  NamecheapApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Namecheap API key paired with the user
  NamecheapUsername:
    Type: String
    Default: ''
    Description: Optional override for the Namecheap account username (defaults to NamecheapApiUser)
  NamecheapApiBase:
    Type: String
    Default: https://api.namecheap.com/xml.response
    Description: Base URL for the Namecheap API (use the sandbox URL when testing)
  ContactFromEmail:
    Type: String
    Default: 'formsubmissions@ai-sitemaker.com'
    Description: Verified SES email used as the From address for contact form submissions.
  GoogleCalendarClientId:
    Type: String
    Default: ''
    Description: Google OAuth client ID for calendar syncing.
  GoogleCalendarClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google OAuth client secret for calendar syncing.
  GoogleCalendarRedirectUri:
    Type: String
    Default: 'https://api.ai-sitemaker.com/oauth/calendar/google/callback'
    Description: Redirect URI registered for Google Calendar OAuth.
  OutlookCalendarClientId:
    Type: String
    Default: ''
    Description: Microsoft/Outlook app client ID for calendar syncing.
  OutlookCalendarClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Microsoft/Outlook app client secret for calendar syncing.
  OutlookCalendarRedirectUri:
    Type: String
    Default: 'https://api.ai-sitemaker.com/oauth/calendar/outlook/callback'
    Description: Redirect URI registered for Outlook calendar OAuth.
  UseRdsProxy:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable an Amazon RDS Proxy endpoint for the Lambda functions to connect through (recommended)

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref ApiCustomDomainName, '']]
    - !Not [!Equals [!Ref ApiCertificateArn, '']]
  HasGeminiSecret: !Not [!Equals [!Ref GeminiApiKeySecretArn, '']]
  HasOpenAISecret: !Not [!Equals [!Ref OpenAIApiKeySecretArn, '']]
  HasPreviewDomain: !Not [!Equals [!Ref PreviewDomainName, '']]
  HasIntegrationKmsKey: !Not [!Equals [!Ref IntegrationKmsKeyArn, '']]
  HasReservedConcurrency: !Not [!Equals [!Ref RunnerReservedConcurrency, 0]]
  HasDbAllowedCidr: !Not [!Equals [!Ref DbAllowedCidr, '']]
  UseDbProxy: !Equals [!Ref UseRdsProxy, 'true']

Resources:
  RunnerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - Stripe-Signature
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowCredentials: true
  RunnerApiCustomDomain:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::DomainName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  RunnerApiDomainMapping:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref RunnerApi
      DomainName: !Ref RunnerApiCustomDomain
      Stage: prod

  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-db-credentials
      Description: Credentials for the AI SiteMaker PostgreSQL database
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "database": "${DBName}"
        }

  RunnerDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      PubliclyAccessible: false
      AllocatedStorage: !Ref DBAllocatedStorage
      DBInstanceClass: !Ref DBInstanceClass
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      BackupRetentionPeriod: 1
      DeletionProtection: false
      MultiAZ: false
      StorageEncrypted: true
      VPCSecurityGroups:
        - !Ref RunnerDbSecurityGroup
      DBSubnetGroupName: !Ref RunnerDbSubnetGroup

  RunnerDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access to Lovable Runner DB
      VpcId: !Ref DbVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RunnerFunctionSecurityGroup
        - !If
          - HasDbAllowedCidr
          - 
            IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            CidrIp: !Ref DbAllowedCidr
          - !Ref AWS::NoValue

  RunnerDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Lovable Runner database
      SubnetIds: !Ref DbSubnetIds
  RunnerDbProxyRole:
    Condition: UseDbProxy
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - rds.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: allow-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseCredentialsSecret
  RunnerDbProxy:
    Condition: UseDbProxy
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub ${AWS::StackName}-proxy
      EngineFamily: POSTGRESQL
      IdleClientTimeout: 1800
      RequireTLS: true
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DatabaseCredentialsSecret
          IAMAuth: DISABLED
      RoleArn: !GetAtt RunnerDbProxyRole.Arn
      VpcSecurityGroupIds:
        - !Ref RunnerFunctionSecurityGroup
      VpcSubnetIds:
        - !Ref RunnerLambdaPrivateSubnetA
        - !Ref RunnerLambdaPrivateSubnetB
  RunnerDbProxyTargetGroup:
    Condition: UseDbProxy
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref RunnerDbProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref RunnerDatabase
  RunnerLambdaPrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DbVpcId
      CidrBlock: !Ref LambdaPrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-private-a
  RunnerLambdaPrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DbVpcId
      CidrBlock: !Ref LambdaPrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-private-b
  RunnerStaticEgressEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-egress
  RunnerStaticNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt RunnerStaticEgressEip.AllocationId
      ConnectivityType: public
      SubnetId: !Ref NatGatewaySubnetId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-nat
  RunnerLambdaPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DbVpcId
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-private
  RunnerLambdaPrivateRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - RunnerStaticNatGateway
    Properties:
      RouteTableId: !Ref RunnerLambdaPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RunnerStaticNatGateway
  RunnerLambdaPrivateSubnetAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RunnerLambdaPrivateRouteTable
      SubnetId: !Ref RunnerLambdaPrivateSubnetA
  RunnerLambdaPrivateSubnetBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RunnerLambdaPrivateRouteTable
      SubnetId: !Ref RunnerLambdaPrivateSubnetB
  RunnerFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the runner Lambda ENIs
      VpcId: !Ref DbVpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-runner-lambda
  LeadInboxTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: leadId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: leadId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  SiteAnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: statDate
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: statDate
          KeyType: RANGE
  SiteReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: reviewId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: reviewId
          KeyType: RANGE
  SiteAppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: appointmentId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: appointmentId
          KeyType: RANGE
  AppointmentSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
  NotificationPreferencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: recipient
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: recipient
          KeyType: RANGE
  RunnerFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - RunnerDatabase
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: dist/lambda.handler
      Description: Backend API for AI SiteMaker
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref RunnerReservedConcurrency
        - !Ref AWS::NoValue
      VpcConfig:
        SecurityGroupIds:
          - !Ref RunnerFunctionSecurityGroup
        SubnetIds:
          - !Ref RunnerLambdaPrivateSubnetA
          - !Ref RunnerLambdaPrivateSubnetB
      Environment:
        Variables: &RunnerEnvVariables
          NODE_ENV: production
          DB_HOST: !If [UseDbProxy, !GetAtt RunnerDbProxy.Endpoint, !GetAtt RunnerDatabase.Endpoint.Address]
          DB_PORT: !If [UseDbProxy, 5432, !GetAtt RunnerDatabase.Endpoint.Port]
          DB_NAME: !Ref DBName
          DB_USERNAME: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_USER_POOL_REGION: !Ref AWS::Region
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
          COGNITO_DOMAIN: !Ref CognitoDomain
          COGNITO_M2M_CLIENT_ID: !Ref UserPoolMachineClient
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          AUTH_CALLBACK_URL: !Ref AuthCallbackUrl
          LOVABLE_DEPLOY_BUCKET: !Ref DeployBucket
          DEPLOY_BUCKET: !Ref DeployBucket
          TEMPLATE_UPLOAD_BUCKET: !Ref TemplateUploadBucket
          DEFAULT_TRIAL_EDIT_LIMIT: !Ref DefaultTrialEditLimit
          PREVIEW_DOMAIN: !Ref PreviewDomainName
          LIVE_DOMAIN: !Ref LiveDomainName
          CUSTOM_DOMAIN_ORIGIN: !Ref CustomDomainOriginHost
          CUSTOM_DOMAIN_CANONICAL_DEFAULT: !Ref CustomDomainCanonicalDefault
          CUSTOM_DOMAIN_DISTRIBUTION_ID: !Ref CustomDomainDistributionId
          CUSTOM_DOMAIN_CERT_REGION: !Ref CustomDomainCertRegion
          CUSTOM_DOMAIN_PRICE_CLASS: !Ref CustomDomainPriceClass
          DOMAIN_BASE_PRICE_CENTS: !Ref DomainBasePriceCents
          DOMAIN_PRICE_MARKUP_CENTS: !Ref DomainPriceMarkupCents
          GEMINI_API_KEY: !If
            - HasGeminiSecret
            - !Sub "{{resolve:secretsmanager:${GeminiApiKeySecretArn}:SecretString}}"
            - !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          OPENAI_API_KEY: !If
            - HasOpenAISecret
            - !Sub "{{resolve:secretsmanager:${OpenAIApiKeySecretArn}:SecretString}}"
            - !Ref OpenAIApiKey
          OPENAI_MODEL: !Ref OpenAIModel
          GOOGLE_IMAGE_MODEL: !Ref GoogleImageModel
          INTEGRATION_KMS_KEY_ARN: !Ref IntegrationKmsKeyArn
          RUNNER_API_BASE: !Ref RunnerApiBase
          COGNITO_M2M_CLIENT_SECRET: !Ref CognitoM2MClientSecret
          SITE_BUILDER_API_ENABLED: !Ref SiteBuilderApiEnabled
          SITE_DOCS_TOKEN: !Ref SiteDocsToken
          THUMBNAIL_SERVICE_BASE: !Ref ThumbnailServiceBase
          UNSPLASH_ACCESS_KEY: !Ref UnsplashAccessKey
          NAMECHEAP_API_USER: !Ref NamecheapApiUser
          NAMECHEAP_API_KEY: !Ref NamecheapApiKey
          NAMECHEAP_USERNAME: !Ref NamecheapUsername
          NAMECHEAP_API_BASE: !Ref NamecheapApiBase
          NAMECHEAP_CLIENT_IP: !Ref RunnerStaticEgressEip
          CONTACT_FROM_EMAIL: !Ref ContactFromEmail
          LEAD_INBOX_TABLE: !Ref LeadInboxTable
          SITE_ANALYTICS_TABLE: !Ref SiteAnalyticsTable
          SITE_REVIEWS_TABLE: !Ref SiteReviewsTable
          SITE_APPOINTMENTS_TABLE: !Ref SiteAppointmentsTable
          APPOINTMENT_SETTINGS_TABLE: !Ref AppointmentSettingsTable
          NOTIFICATION_PREFS_TABLE: !Ref NotificationPreferencesTable
          GOOGLE_CALENDAR_CLIENT_ID: !Ref GoogleCalendarClientId
          GOOGLE_CALENDAR_CLIENT_SECRET: !Ref GoogleCalendarClientSecret
          GOOGLE_CALENDAR_REDIRECT_URI: !Ref GoogleCalendarRedirectUri
          OUTLOOK_CALENDAR_CLIENT_ID: !Ref OutlookCalendarClientId
          OUTLOOK_CALENDAR_CLIENT_SECRET: !Ref OutlookCalendarClientSecret
          OUTLOOK_CALENDAR_REDIRECT_URI: !Ref OutlookCalendarRedirectUri
          DOMAIN_JOB_BATCH_LIMIT: !Ref DomainJobBatchLimit
          DOMAIN_JOB_MAX_RUNTIME_MS: !Ref DomainJobMaxRuntimeMs
          DOMAIN_MAX_PER_ACCOUNT: !Ref DomainMaxPerAccount
          DOMAIN_ORDER_DAILY_LIMIT: !Ref DomainOrderDailyLimit
          DOMAIN_REFRESH_DAILY_LIMIT: !Ref DomainRefreshDailyLimit
          RUNNER_FUNCTION_NAME: !Ref RunnerWorkerFunction
      Events:
        RootProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RunnerApi
            Path: /
            Method: ANY
        CatchAllProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RunnerApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref DeployBucket
        - S3CrudPolicy:
            BucketName: !Ref TemplateUploadBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref LeadInboxTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteAnalyticsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteAppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationPreferencesTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*
        - !If
          - HasIntegrationKmsKey
          - Statement:
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref IntegrationKmsKeyArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - acm:DescribeCertificate
                - acm:ListCertificates
                - acm:RequestCertificate
                - cloudfront:CreateDistribution
                - cloudfront:GetDistribution
                - cloudfront:CreateFunction
                - cloudfront:UpdateFunction
                - cloudfront:DescribeFunction
                - cloudfront:PublishFunction
              Resource: '*'
  RunnerWorkerFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - RunnerDatabase
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: dist/lambda.handler
      Description: Background worker for AI SiteMaker
      Timeout: 900
      MemorySize: 2048
      VpcConfig:
        SecurityGroupIds:
          - !Ref RunnerFunctionSecurityGroup
        SubnetIds:
          - !Ref RunnerLambdaPrivateSubnetA
          - !Ref RunnerLambdaPrivateSubnetB
      Environment:
        Variables: *RunnerEnvVariables
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref DeployBucket
        - S3CrudPolicy:
            BucketName: !Ref TemplateUploadBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref LeadInboxTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteAnalyticsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteAppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationPreferencesTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*
        - !If
          - HasIntegrationKmsKey
          - Statement:
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref IntegrationKmsKeyArn
          - !Ref AWS::NoValue
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - acm:DescribeCertificate
                - acm:ListCertificates
                - acm:RequestCertificate
                - cloudfront:CreateDistribution
                - cloudfront:GetDistribution
                - cloudfront:CreateFunction
                - cloudfront:UpdateFunction
                - cloudfront:DescribeFunction
                - cloudfront:PublishFunction
              Resource: '*'

  DomainHttpsRefreshRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-domain-refresh
      Description: Periodically refreshes custom domain HTTPS status
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: DomainHttpsRefreshTarget
          Arn: !GetAtt RunnerWorkerFunction.Arn
          Input: |
            {"action":"RUN_DOMAIN_HTTPS_REFRESH","limit":25}

  DomainHttpsRefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RunnerWorkerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DomainHttpsRefreshRule.Arn

  DomainJobWorkerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-domain-jobs
      Description: Kicks off the async domain job processor
      ScheduleExpression: rate(2 minutes)
      State: ENABLED
      Targets:
        - Id: DomainJobWorkerTarget
          Arn: !GetAtt RunnerWorkerFunction.Arn
          Input: !Sub |
            {"action":"RUN_DOMAIN_JOBS","limit":${DomainJobBatchLimit}}

  DomainJobWorkerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RunnerWorkerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DomainJobWorkerRule.Arn

  NotificationWorkerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-notification-worker
      Description: Sends queued notification emails
      ScheduleExpression: rate(2 minutes)
      State: ENABLED
      Targets:
        - Id: NotificationWorkerTarget
          Arn: !GetAtt RunnerWorkerFunction.Arn
          Input: |
            {"action":"RUN_NOTIFICATION_JOBS","limit":25}

  NotificationWorkerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RunnerWorkerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt NotificationWorkerRule.Arn

  AnalyticsRollupRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-analytics-rollup
      Description: Nightly analytics rollup
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Id: AnalyticsRollupTarget
          Arn: !GetAtt RunnerWorkerFunction.Arn
          Input: |
            {"action":"RUN_ANALYTICS_ROLLUP"}

  AnalyticsRollupInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RunnerWorkerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AnalyticsRollupRule.Arn

  DomainJobFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /aws/lambda/${RunnerWorkerFunction}
      FilterPattern: '"domain.job.failed"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/DomainJobs
          MetricName: DomainJobFailures

  DomainJobFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-job-failures
      AlarmDescription: Domain job runner is failing repeatedly
      Namespace: !Sub ${AWS::StackName}/DomainJobs
      MetricName: DomainJobFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DomainLifecycleFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /aws/lambda/${RunnerWorkerFunction}
      FilterPattern: '"domain.lifecycle.failed"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/DomainJobs
          MetricName: DomainLifecycleFailures

  DomainLifecycleFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-lifecycle-failures
      AlarmDescription: Domains are entering FAILED state too frequently
      Namespace: !Sub ${AWS::StackName}/DomainJobs
      MetricName: DomainLifecycleFailures
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  DomainThrottleMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub /aws/lambda/${RunnerWorkerFunction}
      FilterPattern: '"ThrottlingException"'
      MetricTransformations:
        - MetricValue: '1'
          MetricNamespace: !Sub ${AWS::StackName}/DomainJobs
          MetricName: DomainAwsThrottles

  DomainThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${AWS::StackName}-domain-aws-throttles
      AlarmDescription: ACM or CloudFront is throttling domain automation calls
      Namespace: !Sub ${AWS::StackName}/DomainJobs
      MetricName: DomainAwsThrottles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ContactEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ContactFromEmail

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-client
      GenerateSecret: false
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://example.com/callback

  UserPoolMachineClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-machine
      GenerateSecret: true
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - lovable-backend/internal
      SupportedIdentityProviders:
        - COGNITO

  UserGroupSuperAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super-admin
      UserPoolId: !Ref UserPool

  UserGroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  UserGroupUser:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      UserPoolId: !Ref UserPool


Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${RunnerApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiCustomDomain:
    Condition: HasCustomDomain
    Description: Custom API domain (if configured)
    Value: !Ref ApiCustomDomainName
  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id
    Value: !Ref UserPoolClient
  UserPoolMachineClientId:
    Description: Cognito machine-to-machine client id
    Value: !Ref UserPoolMachineClient
  DatabaseEndpoint:
    Description: PostgreSQL endpoint address
    Value: !GetAtt RunnerDatabase.Endpoint.Address
  DatabaseName:
    Description: PostgreSQL database name
    Value: !Ref DBName
  DatabaseCredentialsSecretArn:
    Description: Secret ARN containing database credentials
    Value: !Ref DatabaseCredentialsSecret
  StaticEgressIpAddress:
    Description: Elastic IP address used for Lambda outbound traffic
    Value: !Ref RunnerStaticEgressEip
  DatabaseProxyEndpoint:
    Condition: UseDbProxy
    Description: RDS Proxy endpoint used by the Lambda functions
    Value: !GetAtt RunnerDbProxy.Endpoint
