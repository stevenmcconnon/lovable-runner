AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI SiteMaker backend API

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 900
    MemorySize: 2048
    Architectures:
      - x86_64

Parameters:
  DeployBucket:
    Type: String
    Description: S3 bucket that stores generated sites
  ApiCustomDomainName:
    Type: String
    Default: ''
    Description: Optional custom domain (e.g., api.ai-sitemaker.com). Leave blank to skip.
  ApiCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate ARN for the custom domain (us-east-1). Required when ApiCustomDomainName is set.
  DBName:
    Type: String
    Default: aisitemaker
    Description: Name of the application database
  DBUsername:
    Type: String
    Default: lovable_runner
    MinLength: 1
    Description: Master username for the RDS instance
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Master user password for the RDS instance
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Instance class for the RDS instance
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Allocated storage in GiB for the RDS instance
  DbVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-06707eddabf2dae24
    Description: VPC where the RDS instance will live
  DbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-04c228a7b5b68ff53,subnet-0b80e76ccd6b56ac6
    Description: Two or more subnets (different AZs) for the RDS subnet group
  DbAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR block allowed to access the PostgreSQL port (adjust to your frontend's IP range)
  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret API key
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook signing secret
  TemplateUploadBucket:
    Type: String
    Description: S3 bucket used to store uploaded templates
  DefaultTrialEditLimit:
    Type: Number
    Default: 1
    Description: Number of trial edits allowed before subscription is required
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key for Gemini (used by the runner Lambda)
  GeminiApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN holding the Gemini API key (string value)
  GeminiModel:
    Type: String
    Default: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.0-pro:generateContent'
    Description: Optional override for the Gemini model endpoint (use latest Gemini 3 endpoint)
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: API key for the OpenAI Responses API (used when Gemini is disabled)
  OpenAIApiKeySecretArn:
    Type: String
    Default: ''
    Description: Optional Secrets Manager ARN containing the OpenAI API key
  OpenAIModel:
    Type: String
    Default: 'gpt-5.1'
    Description: OpenAI model identifier (e.g., gpt-5.1, gpt-4.1)
  GoogleImageModel:
    Type: String
    Default: 'imagen-3.0-generate-1'
    Description: Image model used for asset generation (e.g., imagen-3.0-generate-1)
  RunnerApiBase:
    Type: String
    Default: https://api.ai-sitemaker.com
    Description: Base URL for posting internal job updates (machine token required)
  CognitoM2MClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Secret for the machine-to-machine Cognito app client (for internal job callbacks)
  CognitoDomain:
    Type: String
    Default: ai-sitemaker-auth.auth.us-east-1.amazoncognito.com
    Description: Cognito hosted UI domain (e.g., yourdomain.auth.us-east-1.amazoncognito.com)
  FrontendOrigin:
    Type: String
    Default: https://ai-sitemaker.com
    Description: Allowed browser origin for API responses
  AuthCallbackUrl:
    Type: String
    Default: https://ai-sitemaker.com/auth/callback
    Description: Redirect URI used for OAuth exchanges
  PreviewDomainName:
    Type: String
    Default: ''
    Description: Optional preview domain (e.g., preview.ai-sitemaker.com) served via CloudFront
  SiteBuilderApiEnabled:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Toggle to enable or disable the /sites builder endpoints.
  SiteDocsToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional shared secret required to view /openapi.json and /docs.
  ThumbnailServiceBase:
    Type: String
    Default: 'https://image.thum.io/get/png/width/1200/noanimate'
    Description: Base URL for screenshot service (appends ?url=...; leave blank to disable thumbnails).
  UnsplashAccessKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Access key for the Unsplash API (used for stock imagery).
  ContactFromEmail:
    Type: String
    Default: 'formsubmissions@ai-sitemaker.com'
    Description: Verified SES email used as the From address for contact form submissions.
  GoogleCalendarClientId:
    Type: String
    Default: ''
    Description: Google OAuth client ID for calendar syncing.
  GoogleCalendarClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Google OAuth client secret for calendar syncing.
  GoogleCalendarRedirectUri:
    Type: String
    Default: 'https://api.ai-sitemaker.com/oauth/calendar/google/callback'
    Description: Redirect URI registered for Google Calendar OAuth.
  OutlookCalendarClientId:
    Type: String
    Default: ''
    Description: Microsoft/Outlook app client ID for calendar syncing.
  OutlookCalendarClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Microsoft/Outlook app client secret for calendar syncing.
  OutlookCalendarRedirectUri:
    Type: String
    Default: 'https://api.ai-sitemaker.com/oauth/calendar/outlook/callback'
    Description: Redirect URI registered for Outlook calendar OAuth.

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref ApiCustomDomainName, '']]
    - !Not [!Equals [!Ref ApiCertificateArn, '']]
  HasGeminiSecret: !Not [!Equals [!Ref GeminiApiKeySecretArn, '']]
  HasOpenAISecret: !Not [!Equals [!Ref OpenAIApiKeySecretArn, '']]
  HasPreviewDomain: !Not [!Equals [!Ref PreviewDomainName, '']]

Resources:
  RunnerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - Stripe-Signature
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowCredentials: true
  RunnerApiCustomDomain:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::DomainName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  RunnerApiDomainMapping:
    Condition: HasCustomDomain
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref RunnerApi
      DomainName: !Ref RunnerApiCustomDomain
      Stage: prod

  DatabaseCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-db-credentials
      Description: Credentials for the AI SiteMaker PostgreSQL database
      SecretString: !Sub |
        {
          "username": "${DBUsername}",
          "password": "${DBPassword}",
          "database": "${DBName}"
        }

  RunnerDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      PubliclyAccessible: true
      AllocatedStorage: !Ref DBAllocatedStorage
      DBInstanceClass: !Ref DBInstanceClass
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      BackupRetentionPeriod: 1
      DeletionProtection: false
      MultiAZ: false
      StorageEncrypted: true
      VPCSecurityGroups:
        - !Ref RunnerDbSecurityGroup
      DBSubnetGroupName: !Ref RunnerDbSubnetGroup

  RunnerDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL access to Lovable Runner DB
      VpcId: !Ref DbVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref DbAllowedCidr

  RunnerDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Lovable Runner database
      SubnetIds: !Ref DbSubnetIds
  LeadInboxTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: leadId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: leadId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  SiteAnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: statDate
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: statDate
          KeyType: RANGE
  SiteReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: reviewId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: reviewId
          KeyType: RANGE
  SiteAppointmentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: appointmentId
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: appointmentId
          KeyType: RANGE
  AppointmentSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
  NotificationPreferencesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
        - AttributeName: recipient
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
        - AttributeName: recipient
          KeyType: RANGE
  RunnerFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - RunnerDatabase
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../
      Handler: dist/lambda.handler
      Description: Backend API for AI SiteMaker
      Environment:
        Variables:
          NODE_ENV: production
          DB_HOST: !GetAtt RunnerDatabase.Endpoint.Address
          DB_PORT: !GetAtt RunnerDatabase.Endpoint.Port
          DB_NAME: !Ref DBName
          DB_USERNAME: !Ref DBUsername
          DB_PASSWORD: !Ref DBPassword
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_USER_POOL_REGION: !Ref AWS::Region
          COGNITO_APP_CLIENT_ID: !Ref UserPoolClient
          COGNITO_DOMAIN: !Ref CognitoDomain
          COGNITO_M2M_CLIENT_ID: !Ref UserPoolMachineClient
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          AUTH_CALLBACK_URL: !Ref AuthCallbackUrl
          LOVABLE_DEPLOY_BUCKET: !Ref DeployBucket
          DEPLOY_BUCKET: !Ref DeployBucket
          TEMPLATE_UPLOAD_BUCKET: !Ref TemplateUploadBucket
          DEFAULT_TRIAL_EDIT_LIMIT: !Ref DefaultTrialEditLimit
          PREVIEW_DOMAIN: !Ref PreviewDomainName
          GEMINI_API_KEY: !If
            - HasGeminiSecret
            - !Sub "{{resolve:secretsmanager:${GeminiApiKeySecretArn}:SecretString}}"
            - !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          OPENAI_API_KEY: !If
            - HasOpenAISecret
            - !Sub "{{resolve:secretsmanager:${OpenAIApiKeySecretArn}:SecretString}}"
            - !Ref OpenAIApiKey
          OPENAI_MODEL: !Ref OpenAIModel
          GOOGLE_IMAGE_MODEL: !Ref GoogleImageModel
          RUNNER_API_BASE: !Ref RunnerApiBase
          COGNITO_M2M_CLIENT_SECRET: !Ref CognitoM2MClientSecret
          SITE_BUILDER_API_ENABLED: !Ref SiteBuilderApiEnabled
          SITE_DOCS_TOKEN: !Ref SiteDocsToken
          THUMBNAIL_SERVICE_BASE: !Ref ThumbnailServiceBase
          UNSPLASH_ACCESS_KEY: !Ref UnsplashAccessKey
          CONTACT_FROM_EMAIL: !Ref ContactFromEmail
          LEAD_INBOX_TABLE: !Ref LeadInboxTable
          SITE_ANALYTICS_TABLE: !Ref SiteAnalyticsTable
          SITE_REVIEWS_TABLE: !Ref SiteReviewsTable
          SITE_APPOINTMENTS_TABLE: !Ref SiteAppointmentsTable
          APPOINTMENT_SETTINGS_TABLE: !Ref AppointmentSettingsTable
          NOTIFICATION_PREFS_TABLE: !Ref NotificationPreferencesTable
          GOOGLE_CALENDAR_CLIENT_ID: !Ref GoogleCalendarClientId
          GOOGLE_CALENDAR_CLIENT_SECRET: !Ref GoogleCalendarClientSecret
          GOOGLE_CALENDAR_REDIRECT_URI: !Ref GoogleCalendarRedirectUri
          OUTLOOK_CALENDAR_CLIENT_ID: !Ref OutlookCalendarClientId
          OUTLOOK_CALENDAR_CLIENT_SECRET: !Ref OutlookCalendarClientSecret
          OUTLOOK_CALENDAR_REDIRECT_URI: !Ref OutlookCalendarRedirectUri
      Events:
        RootProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RunnerApi
            Path: /
            Method: ANY
        CatchAllProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RunnerApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref DeployBucket
        - S3CrudPolicy:
            BucketName: !Ref TemplateUploadBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref LeadInboxTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteAnalyticsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteReviewsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SiteAppointmentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AppointmentSettingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref NotificationPreferencesTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'

  ContactEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref ContactFromEmail

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-client
      GenerateSecret: false
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://example.com/callback

  UserPoolMachineClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: lovable-runner-machine
      GenerateSecret: true
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - lovable-backend/internal
      SupportedIdentityProviders:
        - COGNITO

  UserGroupSuperAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super-admin
      UserPoolId: !Ref UserPool

  UserGroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  UserGroupUser:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: user
      UserPoolId: !Ref UserPool


Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${RunnerApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiCustomDomain:
    Condition: HasCustomDomain
    Description: Custom API domain (if configured)
    Value: !Ref ApiCustomDomainName
  UserPoolId:
    Description: Cognito user pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id
    Value: !Ref UserPoolClient
  UserPoolMachineClientId:
    Description: Cognito machine-to-machine client id
    Value: !Ref UserPoolMachineClient
  DatabaseEndpoint:
    Description: PostgreSQL endpoint address
    Value: !GetAtt RunnerDatabase.Endpoint.Address
  DatabaseName:
    Description: PostgreSQL database name
    Value: !Ref DBName
  DatabaseCredentialsSecretArn:
    Description: Secret ARN containing database credentials
    Value: !Ref DatabaseCredentialsSecret
